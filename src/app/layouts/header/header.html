<header class="app-header border-bottom bg-white sticky-top shadow-sm">
  <nav class="navbar navbar-expand-md navbar-light py-2">
    <div class="container">
      <a class="navbar-brand fw-semibold text-primary mb-0" routerLink="/home">TP Angular</a>
      <button
        class="navbar-toggler border-0 shadow-none px-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navPrincipal"
        aria-controls="navPrincipal"
        aria-expanded="false"
        aria-label="Abrir menú"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navPrincipal">
        <ul class="navbar-nav ms-md-auto align-items-md-center gap-md-1 pt-2 pt-md-0">
          <li class="nav-item">
            <a
              class="nav-link px-md-3"
              routerLink="/home"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link px-md-3" routerLink="/punto1" routerLinkActive="active">Punto 1</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-md-3" routerLink="/punto2" routerLinkActive="active">Punto 2</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-md-3" routerLink="/punto3" routerLinkActive="active">Punto 3</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-md-3" routerLink="/punto4" routerLinkActive="active">Punto 4</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
